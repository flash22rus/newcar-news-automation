
name: NEWCAR Daily News

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newcar-daily-news
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and test news candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository and script version
        shell: bash
        run: |
          set -eu

          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== PYTHON VERSION ==="
          python --version

          echo "=== REQUIRED FILES ==="
          test -f scripts/check_news.py
          test -f scripts/test_news.py
          echo "Both Python files exist."

          echo "=== SCRIPT MARKERS ==="
          grep -nE 'NEWCAR RSS collector|feeds_successful|JSON REPORT:|OUTPUT_FILE' scripts/check_news.py || true

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/check_news.py scripts/test_news.py

      - name: Collect RSS candidates
        run: python scripts/check_news.py

      - name: Run automated tests
        run: python -m unittest discover -s scripts -p "test_news.py" -v

      - name: Upload news report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newcar-news-report
          path: news_candidates.json
          if-no-files-found: warn
          retention-days: 7
