
name: NEWCAR Daily News

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newcar-daily-news
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare news draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "NEWCAR news automation is not enabled yet."
          echo "Next step: add and validate the news agent."
          test -f README.md
