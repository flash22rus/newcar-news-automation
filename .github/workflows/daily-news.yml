
name: NEWCAR Daily News

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newcar-daily-news
  cancel-in-progress: false

jobs:
  collect:
    name: Collect recent news candidates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show commit and script version
        run: |
          echo "=== BRANCH ==="
          git branch --show-current
          echo "=== COMMIT ==="
          git rev-parse HEAD
          echo "=== SCRIPT MARKERS ==="
          grep -nE 'NEWCAR RSS collector|feeds_successful|WARNING: feed unavailable|def collect_feed' scripts/check_news.py || true
          echo "=== SCRIPT BEGINNING ==="
          sed -n '1,35p' scripts/check_news.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect RSS candidates
        run: python scripts/check_news.py
