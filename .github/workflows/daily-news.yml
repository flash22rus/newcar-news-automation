
name: NEWCAR Daily News

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newcar-daily-news
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, analyze and test news
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google News decoder
        run: |
          python -m pip install --upgrade pip
          python -m pip install "googlenewsdecoder==0.2.2" "selectolax<1.0"

      - name: Check required files
        run: |
          set -eu
          test -f scripts/check_news.py
          test -f scripts/test_news.py
          test -f scripts/verify_news.py
          test -f scripts/test_verify_news.py
          echo "All required files exist."

      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/check_news.py \
            scripts/test_news.py \
            scripts/verify_news.py \
            scripts/test_verify_news.py

      - name: Collect RSS candidates
        run: python scripts/check_news.py

      - name: Run automated tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Analyze news candidates
        run: python scripts/verify_news.py

      - name: Upload news reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newcar-news-reports
          path: |
            news_candidates.json
            news_verification.json
          if-no-files-found: warn
          retention-days: 7
